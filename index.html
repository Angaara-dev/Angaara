    <!-- Loading screen: drawn before the app's code arrives, and kept behind its loading
         screens so the embers never restart. The app hides it once it's ready. -->
    <style>
      html:has(body[data-loading]) {
        background-color: #120c1f;
      }
      body[data-loading] {
        margin: 0;
        min-height: 100vh;
      }
      #boot-embers {
        display: none;
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(90% 45% at 50% 112%, rgba(240, 68, 30, 0.42), transparent 75%),
          radial-gradient(50% 40% at 0% 0%, rgba(126, 58, 242, 0.3), transparent 70%),
          linear-gradient(180deg, #120c1f 0%, #2b1347 70%, #4a1730 100%);
      }
      body[data-loading] #boot-embers,
      body[data-splash] #boot-embers {
        display: block;
      }
      #boot-embers > span {
        position: absolute;
        bottom: -10px;
        animation: boot-rise var(--life) linear var(--delay) infinite;
      }
      #boot-embers b {
        display: block;
        animation: boot-sway ease-in-out infinite alternate, boot-twinkle ease-in-out infinite;
      }
      #boot-embers i {
        display: block;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        color: #ffd98a;
        background: radial-gradient(circle, #fff6dc 0%, currentColor 50%, transparent 72%);
        box-shadow: 0 0 calc(var(--s) * 1.8) calc(var(--s) * 0.35) currentColor;
        animation: boot-cool var(--life) linear var(--delay) infinite;
      }
      #boot-embers .far i {
        filter: blur(2px);
        opacity: 0.45;
      }
      .boot-floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 45%;
        background: radial-gradient(
          70% 100% at 50% 110%,
          rgba(255, 110, 50, 0.16),
          transparent 70%
        );
        animation: boot-breathe 5s ease-in-out infinite alternate;
      }
      @keyframes boot-rise {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        70% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(calc(var(--h) * -1));
          opacity: 0;
        }
      }
      @keyframes boot-sway {
        from {
          transform: translateX(calc(var(--dx) * -1));
        }
        to {
          transform: translateX(var(--dx));
        }
      }
      /* Sparks cool from gold to orange to red as they rise. */
      @keyframes boot-cool {
        0% {
          color: #ffd98a;
          transform: scale(1.1);
        }
        25% {
          color: #ffb54d;
        }
        55% {
          color: #ff8a2e;
          transform: scale(1);
        }
        100% {
          color: #e2410f;
          transform: scale(0.7);
        }
      }
      @keyframes boot-twinkle {
        0%,
        100% {
          opacity: 1;
        }
        20% {
          opacity: 0.55;
        }
        35% {
          opacity: 0.95;
        }
        55% {
          opacity: 0.7;
        }
        70% {
          opacity: 1;
        }
        85% {
          opacity: 0.6;
        }
      }
      @keyframes boot-breathe {
        from {
          opacity: 0.6;
        }
        to {
          opacity: 1;
        }
      }
      .boot-center {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font: 15px/22px Inter, 'Segoe UI', system-ui, sans-serif;
        color: #b8b1ab;
      }
      .boot-text {
        min-height: 44px;
      }
      .boot-logo {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .boot-logo::before {
        content: '';
        position: absolute;
        inset: -50px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 140, 80, 0.45),
          rgba(255, 110, 60, 0.18) 30%,
          rgba(255, 90, 40, 0.06) 50%,
          transparent 70%
        );
        mix-blend-mode: screen;
        animation: boot-halo 3s ease-in-out infinite;
      }
      .boot-logo svg {
        position: relative;
        display: block;
        animation: boot-glow 3s ease-in-out infinite;
      }
      .boot-flame {
        transform-origin: 50% 78%;
        transform-box: fill-box;
        animation: boot-flicker 1.8s ease-in-out infinite;
      }
      @keyframes boot-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 12px rgba(255, 107, 61, 0.45));
        }
        50% {
          filter: drop-shadow(0 0 22px rgba(255, 122, 69, 0.7));
        }
      }
      @keyframes boot-flicker {
        0%,
        100% {
          transform: scale(1, 1) skewX(0deg);
        }
        25% {
          transform: scale(0.97, 1.04) skewX(-1.5deg);
        }
        50% {
          transform: scale(1.02, 0.97) skewX(1deg);
        }
        75% {
          transform: scale(0.98, 1.03) skewX(-0.5deg);
        }
      }
      @keyframes boot-halo {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-embers *,
        .boot-logo *,
        .boot-logo::before {
          animation-play-state: paused !important;
        }
      }
    </style>
