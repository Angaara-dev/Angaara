name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows 11, Safari on iPhone
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please remove anything private before posting.
