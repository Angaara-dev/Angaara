[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push only changes the Rust SDK or Markdown.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)bot-sdk' ':(exclude)*.md'"

[build.environment]
  # Monaco makes the bundle big enough to overflow Node's default heap.
  NODE_OPTIONS = "--max-old-space-size=4096"

[[redirects]]
  from = "/config.json"
  to = "/config.json"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

  
[[redirects]]
  from = "/pdf.worker.min.js"
  to = "/pdf.worker.min.js"
  status = 200

[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true