[package]
name = "angaara-runner"
version = "0.1.0"
edition = "2021"
description = "Runs cargo builds for your Angaara account on a machine you choose, over encrypted Matrix."
license = "AGPL-3.0-only"

[dependencies]
angaara-bot = { path = "../angaara-bot" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
